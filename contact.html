<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LA MAISON - Contact & Reservation</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="logo"><a href="index.html">LA <span>MAISON</span></a></div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="reviews.html">Reviews</a>
      <a href="location.html">Location</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a href="contact.html" class="btn-primary">Book Table</a>
  </header>

  <main class="page-container">
    <h1 class="page-title">Reserve <em>a Table</em></h1>
    <p class="subtitle">Book your dining experience or contact us for private events.</p>

    <div style="max-width: 600px; margin: 0 auto; background: #141416; padding: 35px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.05);">
      <form action="https://formspree.io/f/xdekobnz"  method="POST" onsubmit="event.preventDefault(); alert('Reservation submitted!');">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="Your Name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Date & Time</label>
          <input type="datetime-local" required>
        </div>
        <div class="form-group">
          <label>Number of Guests</label>
          <select>
            <option>1 Person</option>
            <option selected>2 People</option>
            <option>4 People</option>
            <option>6+ People</option>
          </select>
        </div>
        <div class="form-group">
          <label>Special Requests</label>
          <textarea rows="4" placeholder="Any dietary restrictions or preferences..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Confirm Reservation</button>
      </form>
    </div>
  </main>

  <footer><p>© 2026 La Maison. Crafted with passion.</p></footer>
  <script src="script.js"></script>
</body>
</html>
